// Complicated Career Bees for NeoForge 26.x, an addon for Complicated Bees.
// Build one Minecraft target per invocation: -PmcTarget=26.1.2 (default) or -PmcTarget=26.2.
// build.ps1 builds both targets with separate project caches.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def mcTarget = providers.gradleProperty('mcTarget').getOrElse('26.1.2')
if (!(mcTarget in ['26.1.2', '26.2'])) throw new GradleException("Unsupported target: ${mcTarget}")
def neoVersion = mcTarget == '26.1.2' ? '26.1.2.122' : '26.2.0.93'
def neoMinVersion = mcTarget == '26.1.2' ? '26.1.2.71' : '26.2.0.57'
def jeiVersion = mcTarget == '26.1.2' ? '29.47.0.111' : '30.42.0.237'

// Complicated Bees jar for the same Minecraft target: libs/<minecraft>/complicated_bees-neoforge-*.jar
// (exactly one), or -PcbJar=<path>.
def cbJar = providers.gradleProperty('cbJar').map { file(it) }.getOrElse(null)
if (cbJar == null) {
    def found = (file("libs/${mcTarget}").listFiles() ?: []).findAll { it.name ==~ /complicated_bees-neoforge-.*\.jar/ }
    if (found.size() != 1) throw new GradleException("Expected exactly one Complicated Bees jar in libs/${mcTarget}/ (found ${found.size()}), or pass -PcbJar=<path>.")
    cbJar = found[0]
}
if (!cbJar.isFile()) throw new GradleException("Complicated Bees jar not found: ${cbJar}")

group = 'dev.oculifelis.careerbees'
version = "2.1.0+${mcTarget}"
base.archivesName = 'careerbees-neoforge'
layout.buildDirectory = file("build/${mcTarget}")
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources.srcDir 'src/datagen/resources'
sourceSets.main.resources.srcDir "src/targets/${mcTarget}/resources"
sourceSets.main.java.srcDir "src/targets/${mcTarget}/java"

repositories {
    maven { url = 'https://maven.blamejared.com/' }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

neoForge {
    version = neoVersion
    runs {
        client { client(); gameDirectory = file("run/${mcTarget}/client"); jvmArgument '-Xmx2G'; jvmArgument '-XX:ActiveProcessorCount=4' }
        server { server(); programArgument '--nogui'; gameDirectory = file("run/${mcTarget}/server"); jvmArgument '-Xmx2G'; jvmArgument '-XX:ActiveProcessorCount=4' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        careerbees { sourceSet(sourceSets.main) }
    }
}

dependencies {
    implementation files(cbJar)
    compileOnly "mezz.jei:jei-${mcTarget}-common-api:${jeiVersion}"
    compileOnly "mezz.jei:jei-${mcTarget}-neoforge-api:${jeiVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '500', '-Xlint:-removal']
}

tasks.named('processResources') {
    eachFile { entry ->
        def overlay = file("src/targets/${mcTarget}/resources/${entry.path}")
        if (overlay.isFile() && entry.file.canonicalFile != overlay.canonicalFile) entry.exclude()
    }
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.version, minecraft_version: mcTarget, neo_version: neoVersion, neo_min_version: neoMinVersion
    }
}

tasks.named('jar') { from('LICENSE.txt') }

// Server-side self test: -PselfTest adds a test mod that checks registries, data and every effect in a
// flat world, writes run/<minecraft>/server/selftest-report.txt and stops the server.
if (providers.gradleProperty('selfTest').isPresent()) {
    sourceSets {
        selftest {
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
        }
    }
    neoForge.mods { careerbees_selftest { sourceSet(sourceSets.selftest) } }
}

// Client shots: -PclientShot adds a dev-only client mod that screenshots the Bee-Bee Gun screen, selector and swarm
// (run beside the Port Test Kit; ccbshot_*.png in run/<minecraft>/client/screenshots).
if (providers.gradleProperty('clientShot').isPresent()) {
    sourceSets {
        clientshot {
            compileClasspath += sourceSets.main.output + configurations.compileClasspath
            runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
        }
    }
    neoForge.mods { careerbees_clientshot { sourceSet(sourceSets.clientshot) } }
}
